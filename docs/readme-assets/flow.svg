<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d">
  <title id="t">Chatseek 使用流程</title>
  <desc id="d">三步：打开站点标签页采集、侧栏关键词搜索、本地 IndexedDB 命中。</desc>
  <rect width="1200" height="220" rx="24" fill="#0B1220"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
    <text x="56" y="48" fill="#8B9BB4" font-size="16" letter-spacing="1.5">HOW IT WORKS</text>
    <!-- steps -->
    <g transform="translate(56 72)">
      <rect width="320" height="110" rx="16" fill="#151D2E" stroke="#2A3A55"/>
      <text x="24" y="36" fill="#5B8CFF" font-size="20" font-weight="700">1</text>
      <text x="52" y="36" fill="#E8EEF7" font-size="20" font-weight="600">打开站点</text>
      <text x="24" y="68" fill="#C5D0E2" font-size="15">chatgpt.com / claude.ai</text>
      <text x="24" y="90" fill="#C5D0E2" font-size="15">grok.com · 浏览要搜的聊天</text>
    </g>
    <path d="M390 127 L430 127" stroke="#2A3A55" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(440 72)">
      <rect width="320" height="110" rx="16" fill="#151D2E" stroke="#2A3A55"/>
      <text x="24" y="36" fill="#5B8CFF" font-size="20" font-weight="700">2</text>
      <text x="52" y="36" fill="#E8EEF7" font-size="20" font-weight="600">侧栏搜索</text>
      <text x="24" y="68" fill="#C5D0E2" font-size="15">点工具栏图标打开侧栏</text>
      <text x="24" y="90" fill="#C5D0E2" font-size="15">完整词匹配关键词</text>
    </g>
    <g transform="translate(824 72)">
      <rect width="320" height="110" rx="16" fill="#151D2E" stroke="#2A3A55"/>
      <text x="24" y="36" fill="#3DDC97" font-size="20" font-weight="700">3</text>
      <text x="52" y="36" fill="#E8EEF7" font-size="20" font-weight="600">本地命中</text>
      <text x="24" y="68" fill="#C5D0E2" font-size="15">IndexedDB 倒排索引</text>
      <text x="24" y="90" fill="#C5D0E2" font-size="15">数据不离开浏览器</text>
    </g>
  </g>
</svg>
