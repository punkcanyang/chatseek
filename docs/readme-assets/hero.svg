<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Chatseek — 本地搜索 ChatGPT / Claude / Grok 旧聊天</title>
  <desc id="desc">深色英雄图：左侧产品名与价值主张，右侧侧栏搜索与本地索引示意。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#121A2B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="120" fill="#5B8CFF" opacity="0.08"/>
  <circle cx="980" cy="320" r="90" fill="#3DDC97" opacity="0.07"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
    <text x="56" y="78" fill="#8B9BB4" font-size="18" letter-spacing="2">CHROME EXTENSION · LOCAL ONLY</text>
    <text x="56" y="148" fill="#E8EEF7" font-size="64" font-weight="700">Chatseek</text>
    <text x="56" y="198" fill="#C5D0E2" font-size="24">在本地搜索你打开过的</text>
    <text x="56" y="234" fill="#C5D0E2" font-size="24">ChatGPT / Claude / Grok 旧聊天</text>
    <g transform="translate(56 278)">
      <rect width="118" height="32" rx="16" fill="#1A2438" stroke="#2A3A55"/>
      <text x="59" y="21" text-anchor="middle" fill="#5B8CFF" font-size="14">IndexedDB</text>
      <rect x="130" width="96" height="32" rx="16" fill="#1A2438" stroke="#2A3A55"/>
      <text x="178" y="21" text-anchor="middle" fill="#3DDC97" font-size="14">不上传</text>
      <rect x="238" width="88" height="32" rx="16" fill="#1A2438" stroke="#2A3A55"/>
      <text x="282" y="21" text-anchor="middle" fill="#8B9BB4" font-size="14">v1.0.1</text>
    </g>
  </g>

  <!-- side panel mock -->
  <g transform="translate(720 48)">
    <rect width="420" height="264" rx="18" fill="#151D2E" stroke="#2A3A55" stroke-width="2"/>
    <text x="24" y="36" fill="#E8EEF7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="18" font-weight="600">Chatseek</text>
    <rect x="24" y="52" width="372" height="40" rx="12" fill="#0B1220" stroke="#5B8CFF" stroke-width="1.5"/>
    <circle cx="48" cy="72" r="8" fill="none" stroke="#5B8CFF" stroke-width="2"/>
    <line x1="54" y1="78" x2="60" y2="84" stroke="#5B8CFF" stroke-width="2"/>
    <text x="72" y="78" fill="#8B9BB4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="16">musicmap</text>
    <!-- results -->
    <rect x="24" y="112" width="372" height="56" rx="10" fill="#1A2438"/>
    <text x="40" y="136" fill="#E8EEF7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15">ChatGPT · MusicMap 方案</text>
    <text x="40" y="156" fill="#8B9BB4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13">完整词匹配 · 页面会话时间</text>
    <rect x="24" y="178" width="372" height="56" rx="10" fill="#1A2438"/>
    <text x="40" y="202" fill="#E8EEF7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15">Claude · 索引设计笔记</text>
    <text x="40" y="222" fill="#8B9BB4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13">本地倒排 · 不代持 Key</text>
    <!-- index dots motif -->
    <g transform="translate(24 248)">
      <circle cx="6" cy="6" r="3" fill="#5B8CFF"/><circle cx="18" cy="6" r="3" fill="#5B8CFF" opacity="0.7"/>
      <circle cx="30" cy="6" r="3" fill="#3DDC97"/><circle cx="42" cy="6" r="3" fill="#5B8CFF" opacity="0.4"/>
      <text x="56" y="10" fill="#8B9BB4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">open-tab 索引点</text>
    </g>
