<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatseek</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="../icons/icon32.png" width="28" height="28" alt="" />
      <div class="brand">
        <h1>Chatseek</h1>
        <p class="tag" id="tag"></p>
      </div>
      <label class="lang" id="langLabel" for="lang"></label>
      <select id="lang"></select>
    </header>

    <label class="search-label" for="q" id="searchLabel"></label>
    <div class="search">
      <input
        id="q"
        type="search"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="search"
      />
    </div>

    <div class="filters" role="tablist">
      <button type="button" role="tab" aria-selected="true" class="chip is-on" data-scope="active" id="filterActive"></button>
      <button type="button" role="tab" aria-selected="false" class="chip" data-scope="platform" data-platform="chatgpt">ChatGPT</button>
      <button type="button" role="tab" aria-selected="false" class="chip" data-scope="platform" data-platform="claude">Claude</button>
      <button type="button" role="tab" aria-selected="false" class="chip" data-scope="platform" data-platform="grok">Grok</button>
      <button type="button" role="tab" aria-selected="false" class="chip" data-scope="platform" data-platform="gemini">Gemini</button>
      <button type="button" role="tab" aria-selected="false" class="chip" data-scope="archived" id="filterArchived"></button>
      <button type="button" role="tab" aria-selected="false" class="chip" data-scope="all" id="filterAll"></button>
      <button type="button" role="tab" aria-selected="false" class="chip" data-scope="images" id="filterImages"></button>
    </div>

    <div class="sort" id="sortBar">
      <button type="button" id="sortField" class="sort-field" aria-haspopup="menu" aria-expanded="false" aria-controls="sortMenu"></button>
      <button type="button" id="sortDir" class="sort-dir"></button>
      <div id="sortMenu" class="sort-menu" role="menu" hidden></div>
    </div>

    <p class="status" id="status" hidden></p>
    <div id="imagePane" class="image-pane" hidden>
      <div class="image-tools">
        <label class="switch" for="showUncached">
          <input type="checkbox" id="showUncached" />
          <span id="showUncachedLabel"></span>
        </label>
        <div class="image-platforms" id="imagePlatforms" role="group">
          <button type="button" class="plat-chip is-on" data-image-platform="" id="imagePlatformAll" aria-pressed="true"></button>
          <button type="button" class="plat-chip" data-image-platform="chatgpt" aria-pressed="false">ChatGPT</button>
          <button type="button" class="plat-chip" data-image-platform="claude" aria-pressed="false">Claude</button>
          <button type="button" class="plat-chip" data-image-platform="gemini" aria-pressed="false">Gemini</button>
          <button type="button" class="plat-chip" data-image-platform="grok" aria-pressed="false">Grok</button>
        </div>
      </div>
      <p id="imageEmpty" class="image-empty" hidden></p>
      <div id="imageGrid" class="image-grid"></div>
    </div>
    <ul class="list" id="list"></ul>

    <footer class="foot">
      <p class="health-warn" id="injectWarn" hidden></p>
      <div class="health" id="health" hidden></div>
      <p class="meta">
        <button type="button" class="link" id="copyDiagBtn"></button>
      </p>
      <textarea id="diagBox" class="diag-box" hidden readonly></textarea>
      <p class="hint" id="hint"></p>
      <p class="meta">
        <span id="counts"></span>
        <button type="button" class="link" id="clearBtn"></button>
      </p>
      <p class="meta">
        <span id="imageCache"></span>
        <button type="button" class="link" id="clearImagesBtn"></button>
      </p>
    </footer>

    <div class="modal" id="removeDialog" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="removeTitle">
        <h2 id="removeTitle"></h2>
        <p id="removeBody"></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="removeCancel"></button>
          <button type="button" class="btn btn-danger" id="removeConfirm"></button>
        </div>
      </div>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
